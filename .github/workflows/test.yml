name: Continuous Testing Pipeline

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

env:
  NODE_VERSION: '22'

jobs:
  backend-tests-and-build:
    name: Backend — test then build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_DB: amarbari_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/amarbari_test?schema=public
      # No pooler in CI — Prisma's directUrl is the same connection.
      DIRECT_URL: postgresql://postgres:password@localhost:5432/amarbari_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: cd server && npm ci
      - run: cd server && npx prisma generate
      - run: cd server && npx prisma migrate reset --force --skip-seed

      # Step 1: Run tests first
      - run: cd server && npm run test

      # Step 2: Build project ONLY if tests pass
      - run: cd server && npm run build

  frontend-tests-and-build:
    name: Frontend — test then build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: cd client && npm ci

      # Step 1: Run unit/integration tests first
      - run: cd client && npm run test

      # Step 2: Build production SPA assets ONLY if tests pass
      - run: cd client && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 3

  e2e-tests:
    name: E2E — cross-role journeys
    needs: [backend-tests-and-build, frontend-tests-and-build]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_DB: amarbari
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/amarbari?schema=public
      DIRECT_URL: postgresql://postgres:password@localhost:5432/amarbari?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_SOCKET_URL: http://localhost:4000
      # An E2E run drives many logins/OTPs from one IP; relax the guards for CI only.
      RATE_LIMIT_AUTH: '1000'
      RATE_LIMIT_OTP: '1000'
      RATE_LIMIT_GENERAL: '10000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: cd server && npm ci
      - run: cd client && npm ci
      - run: cd e2e && npm ci

      - run: cd server && npx prisma migrate deploy && npm run seed

      - run: cd e2e && npx playwright install --with-deps chromium
      - run: npm run e2e:playwright

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
